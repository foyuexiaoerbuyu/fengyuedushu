<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>风月读书 · 我的书架</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Microsoft YaHei", Arial, sans-serif; background: #f5f6f8; color: #2c3038; font-size: 14px; }
  header { background: #23283a; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .stat { font-size: 13px; color: #a9b1c7; }
  header .topnav { display: flex; gap: 4px; margin-left: auto; }
  header .topnav a { color: #c8cfdd; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  header .topnav a:hover { background: #323848; color: #fff; }
  header .topnav a.active { background: #2f6feb; color: #fff; }
  header .btn-logout { background: #323848; color: #dfe4ee; border: 1px solid #454c60; }
  header .btn-logout:hover { color: #fff; border-color: #7d879f; }
  main { padding: 20px 24px 48px; max-width: 1180px; margin: 0 auto; }
  .panel { background: #fff; border-radius: 8px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.05); margin-bottom: 16px; }
  .panel h2 { margin: 0 0 14px; font-size: 15px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  input[type=text], input[type=password], input[type=file], select { border: 1px solid #d5d9e2; border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none; background: #fff; }
  input[type=text]:focus, input[type=password]:focus, select:focus { border-color: #2f6feb; }
  button.btn { border: 1px solid #d5d9e2; background: #fff; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button.btn:hover { border-color: #2f6feb; color: #2f6feb; }
  button.primary { background: #2f6feb; border-color: #2f6feb; color: #fff; }
  button.primary:hover { background: #2359c4; color: #fff; }
  button.danger { color: #d93b3b; border-color: #f0c6c6; }
  button.danger:hover { background: #fdf1f1; }
  button.link { border: 0; background: none; color: #2f6feb; cursor: pointer; padding: 0 4px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eef0f4; font-size: 13px; vertical-align: middle; }
  th { background: #fafbfc; color: #6b7280; font-weight: 600; white-space: nowrap; }
  tr:hover td { background: #fafcff; }
  .tag { display: inline-block; background: #eef3ff; color: #2f6feb; border-radius: 4px; padding: 1px 7px; font-size: 11px; }
  .tag.private { background: #fff3e6; color: #b26a00; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 5px; }
  .field input, .field select { width: 100%; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { color: #9aa1ae; font-size: 12px; margin-top: 6px; }
  .empty { padding: 36px; text-align: center; color: #9aa1ae; }
  .auth-wrap { max-width: 420px; margin: 40px auto; }
  .auth-tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .auth-tabs button { flex: 1; border: 1px solid #d5d9e2; background: #fff; padding: 8px; cursor: pointer; font-size: 13px; border-radius: 6px; }
  .auth-tabs button.active { background: #2f6feb; border-color: #2f6feb; color: #fff; font-weight: 600; }
  .msg { font-size: 12px; min-height: 16px; margin: 8px 0 0; color: #c93434; }
  #toast { position: fixed; right: 20px; bottom: 20px; background: #23283a; color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 420px; }
  #toast.show { opacity: .95; }
  #toast.error { background: #c93434; }
#pwdMask { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(35,40,58,.72); display: flex; align-items: center; justify-content: center; z-index: 120; }
#pwdMask.hide { display: none; }
.pwd-box { background: #fff; border-radius: 10px; padding: 24px; width: 360px; max-width: 90vw; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
.pwd-box h2 { margin: 0 0 14px; font-size: 16px; }
</style>
</head>
<body>
<header>
  <h1>风月读书 · 我的书架</h1>
  <span class="stat" id="statInfo">未登录</span>
  <div class="topnav">
    <a href="/library.html">公开书库</a>
    <a href="/user.html" class="active">我的书架</a>
    <a href="/index.html">管理后台</a>
  </div>
  <button class="btn btn-logout" id="btnPwd" style="display:none;margin-left:auto" onclick="openPwd()">修改密码</button>
  <button class="btn btn-logout" id="btnLogout" style="display:none" onclick="doLogout()">退出登录</button>
</header>

<main>
  <!-- 未登录：注册 / 登录 -->
  <div id="authView" class="auth-wrap" style="display:none">
    <div class="panel">
      <div class="auth-tabs">
        <button id="tabLogin" class="active" onclick="switchAuth('login')">登录</button>
        <button id="tabRegister" onclick="switchAuth('register')">注册</button>
      </div>
      <div class="field">
        <label>用户名</label>
        <input type="text" id="authUsername" placeholder="字母/数字/下划线，3-32 位" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="authPassword" placeholder="至少 6 位，含字母和数字" autocomplete="current-password">
      </div>
      <div class="field" id="nicknameField" style="display:none">
        <label>昵称（可选）</label>
        <input type="text" id="authNickname" placeholder="展示用昵称">
      </div>
      <button class="btn primary" style="width:100%" onclick="submitAuth()">提交</button>
      <p class="msg" id="authMsg"></p>
      <p class="hint" id="authHint">登录后即可上传自己的 TXT 书籍，并把书设为公开供他人（含 App 匿名）阅读。</p>
    </div>
  </div>

  <!-- 已登录 -->
  <div id="userView" style="display:none">
    <div class="panel">
      <h2>上传 TXT 书籍</h2>
      <div class="grid2">
        <div class="field">
          <label>TXT 文件（≤64MB，自动识别 UTF-8 / GB18030）</label>
          <input type="file" id="upFile" accept=".txt">
        </div>
        <div class="field">
          <label>书名（留空则取文件名或正文内的书名）</label>
          <input type="text" id="upName" placeholder="可选">
        </div>
        <div class="field">
          <label>作者（可选）</label>
          <input type="text" id="upAuthor" placeholder="可选">
        </div>
        <div class="field">
          <label>分类（可选）</label>
          <input type="text" id="upCategory" placeholder="如 玄幻 / 都市，留空为「其他」">
        </div>
        <div class="field">
          <label>可见性</label>
          <select id="upVisibility">
            <option value="PRIVATE">私有（仅自己可读）</option>
            <option value="PUBLIC">公开（匿名也可读，App 可见）</option>
          </select>
        </div>
        <div class="field" style="display:flex; align-items:flex-end">
          <button class="btn primary" id="btnUpload" onclick="uploadTxt()">上传并解析入库</button>
        </div>
      </div>
      <p class="hint">上传后可随时在下方列表切换「公开 / 私有」。公开书籍会出现在公开书库页，App 未登录也能浏览。</p>
    </div>

    <div class="panel">
      <h2>我的书籍</h2>
      <div class="toolbar">
        <input type="text" id="myKeyword" placeholder="书名关键词" style="width:200px"
               onkeydown="if(event.key==='Enter'){event.preventDefault();loadMine(1)}">
        <button class="btn" onclick="loadMine(1)">查询</button>
        <button class="btn" onclick="document.getElementById('myKeyword').value='';loadMine(1)">重置</button>
        <span class="hint" id="mineInfo" style="margin-left:auto"></span>
      </div>
      <table>
        <thead>
          <tr><th>书名</th><th style="width:120px">作者</th><th style="width:90px">分类</th>
              <th style="width:70px">章节</th><th style="width:90px">可见性</th>
              <th style="width:120px">更新时间</th><th style="width:210px">操作</th></tr>
        </thead>
        <tbody id="mineRows"></tbody>
      </table>
      <div class="toolbar" style="margin-top:14px">
        <button class="btn" onclick="prevMine()">上一页</button>
        <span class="hint" id="minePage"></span>
        <button class="btn" onclick="nextMine()">下一页</button>
      </div>
    </div>
  </div>
</main>

<div id="pwdMask" class="hide">
  <div class="pwd-box">
    <h2>修改密码</h2>
    <div class="field"><label>原密码</label><input type="password" id="pwdOld" autocomplete="current-password"></div>
    <div class="field"><label>新密码（至少 6 位）</label><input type="password" id="pwdNew" autocomplete="new-password"></div>
    <div class="field"><label>确认新密码</label><input type="password" id="pwdNew2" autocomplete="new-password"></div>
    <p class="msg" id="pwdMsg"></p>
    <button class="btn primary" onclick="submitPwd()">确认修改</button>
    <button class="btn" onclick="closePwd()">取消</button>
  </div>
</div>

<div id="toast"></div>
<script>
const TOKEN_KEY = 'fy_user_token';
const state = { minePage: 1, mineSize: 20, minePages: 1, authMode: 'login', me: null };

function token() { return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 2800);
}
function fmt(dt) { return dt ? String(dt).replace('T', ' ').substring(0, 16) : '-'; }

async function api(path, options) {
  const opts = Object.assign({}, options || {});
  const headers = Object.assign({}, opts.headers || {});
  const t = token();
  if (t) headers['X-FY-Token'] = t;
  opts.headers = headers;
  const res = await fetch(path, opts);
  let json;
  try { json = await res.json(); } catch (e) { throw new Error('返回内容不是 JSON（' + res.status + '）'); }
  if (res.status === 401 || json.code === 401) {
    setToken('');
    state.me = null;
    renderAuthState();
    throw new Error(json.message || '登录已失效，请重新登录');
  }
  if (json.code !== 0) { throw new Error(json.message || ('请求失败 ' + json.code)); }
  return json.data;
}

function switchAuth(mode) {
  state.authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('nicknameField').style.display = mode === 'register' ? '' : 'none';
  document.getElementById('authMsg').textContent = '';
}

async function submitAuth() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const nickname = document.getElementById('authNickname').value.trim();
  const msg = document.getElementById('authMsg');
  msg.textContent = '';
  if (!username || !password) { msg.textContent = '请填写用户名和密码'; return; }
  const isRegister = state.authMode === 'register';
  try {
    const d = await api('/api/v1/auth/' + (isRegister ? 'register' : 'login'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, nickname: nickname || undefined })
    });
    setToken(d.token);
    toast(isRegister ? '注册成功，已自动登录' : '登录成功');
    document.getElementById('authPassword').value = '';
    await renderAuthState();
  } catch (e) {
    msg.textContent = e.message;
  }
}

async function renderAuthState() {
  const stat = document.getElementById('statInfo');
  const btn = document.getElementById('btnLogout');
  const btnPwd = document.getElementById('btnPwd');
  const authView = document.getElementById('authView');
  const userView = document.getElementById('userView');
  if (!token()) {
    state.me = null;
    stat.textContent = '未登录';
    btn.style.display = 'none';
    if (btnPwd) { btnPwd.style.display = 'none'; }
    authView.style.display = '';
    userView.style.display = 'none';
    return;
  }
  try {
    state.me = await api('/api/v1/auth/me');
    stat.textContent = '已登录：' + (state.me.nickname || state.me.username);
    btn.style.display = '';
    if (btnPwd) { btnPwd.style.display = ''; }
    authView.style.display = 'none';
    userView.style.display = '';
    loadMine(1);
  } catch (e) {
    state.me = null;
    stat.textContent = '未登录';
    btn.style.display = 'none';
    authView.style.display = '';
    userView.style.display = 'none';
    document.getElementById('authMsg').textContent = '登录状态已失效，请重新登录';
  }
}

async function loadMine(page) {
  if (page) state.minePage = page;
  const kw = document.getElementById('myKeyword').value.trim();
  const qs = new URLSearchParams({ page: state.minePage, size: state.mineSize });
  if (kw) qs.set('keyword', kw);
  const tbody = document.getElementById('mineRows');
  tbody.innerHTML = '<tr><td colspan="7" class="empty">加载中…</td></tr>';
  try {
    const d = await api('/api/v1/me/books?' + qs.toString());
    state.minePages = d.pages || 1;
    const rows = d.records || [];
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">还没有上传过书籍，试试上方上传 TXT</td></tr>';
    } else {
      tbody.innerHTML = rows.map(b => {
        const isPublic = b.visibility !== 'PRIVATE';
        return `<tr>
          <td>${esc(b.name)}</td>
          <td>${esc(b.author || '佚名')}</td>
          <td>${esc(b.category || '未分类')}</td>
          <td>${b.chapterCount == null ? '-' : b.chapterCount}</td>
          <td><span class="tag${isPublic ? '' : ' private'}">${isPublic ? '公开' : '私有'}</span></td>
          <td>${esc(fmt(b.updateTime))}</td>
          <td>
            <button class="link" onclick="toggleVisibility('${esc(b.id)}','${isPublic ? 'PRIVATE' : 'PUBLIC'}')">
              ${isPublic ? '设为私有' : '设为公开'}</button>
            <button class="link" onclick="window.open('/library.html?book=${encodeURIComponent(b.id)}','_blank')">阅读</button>
            <button class="link" style="color:#d93b3b" onclick="removeBook('${esc(b.id)}','${esc(b.name)}')">删除</button>
          </td>
        </tr>`;
      }).join('');
    }
    document.getElementById('minePage').textContent = `第 ${d.page || 1} / ${state.minePages} 页 · 共 ${d.total || 0} 本`;
    document.getElementById('mineInfo').textContent = state.me ? ('账号：' + (state.me.username || '')) : '';
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">加载失败：' + esc(e.message) + '</td></tr>';
  }
}

function prevMine() { if (state.minePage > 1) loadMine(state.minePage - 1); }
function nextMine() { if (state.minePage < state.minePages) loadMine(state.minePage + 1); }

async function toggleVisibility(bookId, visibility) {
  try {
    await api('/api/v1/me/books/' + encodeURIComponent(bookId) + '/visibility?visibility=' + visibility, { method: 'PUT' });
    toast(visibility === 'PUBLIC' ? '已设为公开，匿名用户与 App 均可阅读' : '已设为私有，仅自己可读');
    loadMine();
  } catch (e) { toast(e.message, true); }
}

async function removeBook(bookId, name) {
  if (!confirm('确定删除《' + name + '》？该操作会连带删除其章节，且不可撤销。')) return;
  try {
    await api('/api/v1/me/books/' + encodeURIComponent(bookId), { method: 'DELETE' });
    toast('已删除《' + name + '》');
    loadMine();
  } catch (e) { toast(e.message, true); }
}

async function uploadTxt() {
  const fileEl = document.getElementById('upFile');
  if (!fileEl.files || !fileEl.files.length) { toast('请先选择 TXT 文件', true); return; }
  const fd = new FormData();
  fd.append('file', fileEl.files[0]);
  const name = document.getElementById('upName').value.trim();
  const author = document.getElementById('upAuthor').value.trim();
  const category = document.getElementById('upCategory').value.trim();
  const visibility = document.getElementById('upVisibility').value;
  if (name) fd.append('bookName', name);
  if (author) fd.append('author', author);
  if (category) fd.append('category', category);
  fd.append('visibility', visibility);
  const btn = document.getElementById('btnUpload');
  btn.disabled = true;
  btn.textContent = '上传解析中…';
  try {
    const d = await api('/api/v1/me/books/txt', { method: 'POST', body: fd });
    toast(`上传成功：《${d.bookName}》共 ${d.chapterCount} 章（${d.encoding}）`);
    fileEl.value = '';
    document.getElementById('upName').value = '';
    document.getElementById('upAuthor').value = '';
    document.getElementById('upCategory').value = '';
    loadMine(1);
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '上传并解析入库';
  }
}

/* ---------- 修改密码 ---------- */
function openPwd() {
  document.getElementById('pwdOld').value = '';
  document.getElementById('pwdNew').value = '';
  document.getElementById('pwdNew2').value = '';
  document.getElementById('pwdMsg').textContent = '';
  document.getElementById('pwdMask').classList.remove('hide');
}

function closePwd() {
  document.getElementById('pwdMask').classList.add('hide');
}

async function submitPwd() {
  const oldPwd = document.getElementById('pwdOld').value || '';
  const newPwd = document.getElementById('pwdNew').value || '';
  const newPwd2 = document.getElementById('pwdNew2').value || '';
  const msg = document.getElementById('pwdMsg');
  if (!oldPwd) { msg.textContent = '请输入原密码'; return; }
  if (newPwd.length < 6) { msg.textContent = '新密码至少 6 位'; return; }
  if (newPwd !== newPwd2) { msg.textContent = '两次输入的新密码不一致'; return; }
  msg.textContent = '正在提交...';
  try {
    await api('/api/v1/auth/password', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd }) });
    closePwd();
    toast('密码已修改，其它设备需重新登录');
  } catch (e) { msg.textContent = e.message; }
}

async function doLogout() {
  try { await api('/api/v1/auth/logout', { method: 'POST' }); } catch (e) { /* 忽略 */ }
  setToken('');
  await renderAuthState();
  toast('已退出登录');
}

(async function init() {
  try {
    const cfg = await api('/api/v1/auth/config');
    if (cfg && cfg.allowRegister === false) {
      document.getElementById('tabRegister').style.display = 'none';
      document.getElementById('authHint').textContent = '服务端已关闭注册，请联系部署者开通账号。';
    }
  } catch (e) { /* 配置读取失败不影响登录 */ }
  if (!token()) switchAuth('login');
  await renderAuthState();
})();
</script>
</body>
</html>
