<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>章节详情</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f6f8; color: #1f2937;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }
  .card { background: #fff; border-radius: 10px; padding: 26px 30px;
          box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .crumb { font-size: 13px; color: #6b7280; margin-bottom: 10px; }
  .crumb a { color: #2f6fed; text-decoration: none; }
  h1 { font-size: 22px; line-height: 1.5; margin: 0 0 10px; }
  .meta { font-size: 13px; color: #6b7280; padding-bottom: 14px;
          border-bottom: 1px solid #eef1f5; margin-bottom: 18px; }
  .meta span { margin-right: 14px; }
  .content { font-size: 17px; line-height: 1.95; color: #24292f; word-break: break-word; }
  .content p { margin: 0 0 14px; text-indent: 2em; }
  .empty { padding: 60px 0; text-align: center; color: #9aa4b2; font-size: 14px; }
  .muted { color: #6b7280; }
  .login { max-width: 380px; margin: 80px auto; background: #fff; border-radius: 10px;
           padding: 26px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .login h2 { font-size: 16px; margin: 0 0 6px; }
  .login p { font-size: 13px; color: #6b7280; margin: 0 0 14px; }
  .login input { width: 100%; padding: 10px 12px; border: 1px solid #d7dce3; border-radius: 6px;
                 font-size: 14px; margin-bottom: 12px; }
  .login button { width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #2f6fed;
                  color: #fff; font-size: 14px; cursor: pointer; }
  .msg { color: #d93b3b; font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  .btn { padding: 6px 12px; border: 1px solid #d7dce3; background: #fff; border-radius: 6px;
         font-size: 13px; color: #374151; cursor: pointer; text-decoration: none; }
  .btn:hover { background: #f3f5f8; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const ADMIN_TOKEN_KEY = 'fy_admin_token';
const qs = new URLSearchParams(location.search);
const bookId = qs.get('bookId') || '';
const chapterId = qs.get('chapterId') || '';
let adminToken = qs.get('adminToken') || sessionStorage.getItem(ADMIN_TOKEN_KEY) || '';

const app = document.getElementById('app');

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmt(dt) {
  if (!dt) return '-';
  const d = new Date(dt);
  if (isNaN(d.getTime())) return '-';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
         p(d.getHours()) + ':' + p(d.getMinutes());
}

function showLogin(message) {
  app.innerHTML = `
    <div class="login">
      <h2>需要管理口令</h2>
      <p>新窗口无法携带登录态，请再输入一次管理口令（仅本次窗口使用）。</p>
      <div class="msg" id="loginMsg">${esc(message || '')}</div>
      <input type="password" id="tokenInput" placeholder="请输入管理口令" autocomplete="current-password">
      <button id="loginBtn">确定</button>
    </div>`;
  const input = document.getElementById('tokenInput');
  const submit = () => {
    const token = input.value.trim();
    if (!token) { document.getElementById('loginMsg').textContent = '口令不能为空'; return; }
    adminToken = token;
    const url = new URL(location.href);
    url.searchParams.set('adminToken', token);
    history.replaceState(null, '', url.toString());
    load();
  };
  document.getElementById('loginBtn').onclick = submit;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  input.focus();
}

async function load() {
  if (!bookId || !chapterId) {
    app.innerHTML = '<div class="wrap"><div class="card"><div class="empty">缺少书籍 ID 或章节 ID，请从管理后台章节列表重新打开。</div></div></div>';
    return;
  }
  if (!adminToken) { showLogin(''); return; }
  app.innerHTML = '<div class="wrap"><div class="card"><div class="empty">加载中…</div></div></div>';
  let res;
  try {
    res = await fetch('/api/admin/books/' + encodeURIComponent(bookId) +
      '/chapters/' + encodeURIComponent(chapterId) + '/detail',
      { headers: { 'X-Admin-Token': adminToken } });
  } catch (e) {
    app.innerHTML = '<div class="wrap"><div class="card"><div class="empty">网络异常，无法连接服务端。</div></div></div>';
    return;
  }
  if (res.status === 401) {
    adminToken = '';
    sessionStorage.removeItem(ADMIN_TOKEN_KEY);
    showLogin('管理口令无效或已失效，请重新输入');
    return;
  }
  let json = null;
  try { json = await res.json(); } catch (e) { json = null; }
  if (!json || json.code !== 0) {
    const tip = (json && json.message) || ('请求失败（HTTP ' + res.status + '）');
    app.innerHTML = '<div class="wrap"><div class="card"><div class="empty">' + esc(tip) + '</div></div></div>';
    return;
  }
  const d = json.data || {};
  sessionStorage.setItem(ADMIN_TOKEN_KEY, adminToken);
  const paragraphs = String(d.content == null ? '' : d.content)
    .replace(/\r\n/g, '\n').split('\n')
    .map(l => l.trim()).filter(l => l.length)
    .map(l => '<p>' + esc(l) + '</p>').join('');
  app.innerHTML = `
    <div class="wrap">
      <div class="toolbar">
        <a class="btn" href="javascript:history.back()">返回</a>
        <a class="btn" href="/index.html" target="_blank">管理后台</a>
      </div>
      <div class="card">
        <div class="crumb">《${esc(d.bookName || '未知书籍')}》${d.author ? ' · ' + esc(d.author) : ''}</div>
        <h1>${esc(d.title || '（无标题）')}</h1>
        <div class="meta">
          <span>第 ${d.chapterNo == null ? '-' : d.chapterNo} 章</span>
          <span>字数 ${d.wordCount == null ? 0 : d.wordCount}</span>
          <span>${d.vip ? 'VIP 章节' : '免费章节'}</span>
          <span>更新 ${fmt(d.updateTime)}</span>
        </div>
        <div class="content">${paragraphs || '<div class="empty">该章节暂无正文内容</div>'}</div>
      </div>
    </div>`;
}

load();
</script>
</body>
</html>
