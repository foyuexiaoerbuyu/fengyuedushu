server:
  port: 8088
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: fyreader-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/fyreader;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    # 数据库密码走环境变量，避免空口令入库
    password: ${H2_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  h2:
    console:
      # 生产默认关闭；本地排查需要时用 H2_CONSOLE_ENABLED=true 临时开启
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false
  servlet:
    multipart:
      # 需容纳 APK 安装包（业务上限见 ApkStorageService.MAX_APK_SIZE，200MB）
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  web:
    resources:
      static-locations: classpath:/static/

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fyreader.service.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-statement-timeout: 30

logging:
  level:
    root: info
    com.fyreader.service: debug
    com.fyreader.service.mapper: debug

fyreader:
  # 客户端接口鉴权开关，对应环境变量 FYREADER_AUTH_ENABLED
  # true（默认）：/api/v1/** 需要有效身份——匿名仅可读公开书，登录用户可读公开书+自己私有书，
  #               共享口令（token）与登录 token 任一有效即可；仍需要鉴权的私有资源由业务层拒绝。
  #               注意：health / app/apk / auth 登录注册接口已在 WebConfig 中放行，不受本开关影响。
  # false：/api/v1/** 完全不校验，一律放行（仅本地调试使用）
  auth-enabled: ${FYREADER_AUTH_ENABLED:true}
  # 共享访问口令，请求头 X-FY-Token，对应环境变量 FYREADER_TOKEN
  # 携带该口令视为服务部署者本人（可读全部书籍，含他人私有书），用于保留旧版单机客户端
  # 为空时该通道关闭，只能通过登录 token 访问
  token: ${FYREADER_TOKEN:}
  # 是否允许自助注册，对应环境变量 FYREADER_ALLOW_REGISTER；默认关闭，账号由管理员在后台开通
  allow-register: ${FYREADER_ALLOW_REGISTER:false}
  # 引导创建的管理员用户名，对应环境变量 FYREADER_ADMIN_USERNAME
  # 首次启动时若库中不存在该账号，会自动创建并生成随机密码，见启动日志中的 “管理员账号已创建”
  admin-username: ${FYREADER_ADMIN_USERNAME:admin}
  # 登录会话有效期（天），对应环境变量 FYREADER_SESSION_DAYS
  session-days: ${FYREADER_SESSION_DAYS:7}
  # 密码最小长度，对应环境变量 FYREADER_PASSWORD_MIN_LENGTH
  password-min-length: ${FYREADER_PASSWORD_MIN_LENGTH:6}
  # 管理端 token，请求头 X-Admin-Token，对应环境变量 FYREADER_ADMIN_TOKEN；为空时 /api/admin/** 全部 401
  admin-token: ${FYREADER_ADMIN_TOKEN:}
  # 单次接口默认分页大小
  default-page-size: 20
  max-page-size: 200
  # APK 存放目录：/api/v1/app/apk 会返回该目录下 version_code 最大的安装包
  apk-dir: ./data/apk
