server:
  port: 8088
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: fyreader-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/fyreader;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  web:
    resources:
      static-locations: classpath:/static/

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fyreader.service.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-statement-timeout: 30

logging:
  level:
    root: info
    com.fyreader.service: debug
    com.fyreader.service.mapper: debug

fyreader:
  # 对外接口鉴权开关：false 时 /api/v1/** 不校验 token
  auth-enabled: false
  # 客户端需携带的 token（auth-enabled=true 时生效），请求头 X-FY-Token
  token: fyreader-lite-token
  # 单次接口默认分页大小
  default-page-size: 20
  max-page-size: 200
  # APK 存放目录：/api/v1/app/apk 会返回该目录下 version_code 最大的安装包
  apk-dir: ./data/apk
