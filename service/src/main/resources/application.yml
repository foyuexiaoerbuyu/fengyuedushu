server:
  port: 8088
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: fyreader-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/fyreader;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    # 数据库密码走环境变量，避免空口令入库
    password: ${H2_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  h2:
    console:
      # 生产默认关闭；本地排查需要时用 H2_CONSOLE_ENABLED=true 临时开启
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false
  servlet:
    multipart:
      # 需容纳 APK 安装包（业务上限见 ApkStorageService.MAX_APK_SIZE，200MB）
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  web:
    resources:
      static-locations: classpath:/static/

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fyreader.service.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-statement-timeout: 30

logging:
  level:
    root: info
    com.fyreader.service: debug
    com.fyreader.service.mapper: debug

fyreader:
  # 客户端接口鉴权开关，对应环境变量 FYREADER_AUTH_ENABLED；默认开启，无特殊需求不要关
  auth-enabled: ${FYREADER_AUTH_ENABLED:true}
  # 客户端 token，请求头 X-FY-Token，对应环境变量 FYREADER_TOKEN；为空时 /api/v1/** 全部 401
  token: ${FYREADER_TOKEN:}
  # 管理端 token，请求头 X-Admin-Token，对应环境变量 FYREADER_ADMIN_TOKEN；为空时 /api/admin/** 全部 401
  admin-token: ${FYREADER_ADMIN_TOKEN:}
  # 单次接口默认分页大小
  default-page-size: 20
  max-page-size: 200
  # APK 存放目录：/api/v1/app/apk 会返回该目录下 version_code 最大的安装包
  apk-dir: ./data/apk
